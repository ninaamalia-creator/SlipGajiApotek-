name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak file zip project
        run: for z in *.zip; do [ -f "$z" ] && unzip -o "$z"; done; true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Ganti nama APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SlipGajiApotek-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SlipGajiApotek-APK
          path: SlipGajiApotek-v${{ github.run_number }}.apk

      - name: Buat Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Slip Gaji Apotek v1.0.${{ github.run_number }}
          body: APK otomatis dari build #${{ github.run_number }}
          files: SlipGajiApotek-v${{ github.run_number }}.apk
